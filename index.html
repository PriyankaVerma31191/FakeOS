<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try Windows 11</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <div class="icons">
        <img src="chromeicon.png" width="74px" alt="">
        <div>Google Chrome</div>
    </div> -->

    <div id = "icons">
        <img src="./Assets/earth.png" alt="earth" id="worldicon">
        <p> World App</p>
    </div>
    <dialog id =openModal>
        
        <h2> World App</h2>
        <form id = "inquiryForm">
            <label for ="country">Country</label>
            <input type="text" id="country">
            <!-- country data  -->
            <div id="countryData">
                <p id="countryName"></p>
                <p id="countryRegion"></p>
                <p id="countryCapital"></p>
            </div>
            <button id ="submit">Submit</button>
        </form>
        <button id ="closeModal">Close</button>
    </dialog>

    <div class="taskbar">
        <img src="./Assets/icons.PNG" alt="">
        <div class="right">
            <span id="dateTime"></span>
        </div>
    </div>
        <!-- <img class="right" src="./Assets/taskbarright.PNG" alt="">
    </div> -->
    <div class="startmenu">
        <img src="./Assets/startmenu.PNG" alt="">
    </div>
    <video autoplay muted id="vid">
        <source src="./Assets/video.webm" type="video/webm">
    </video>
</body>
<script src="script.js"></script>
</html>
